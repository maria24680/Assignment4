<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- links -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body class="geist max-w-[90%] m-auto bg-[#F8FAFC]">
<header>
<h1 class="text-3xl font-bold my-5">Job Application Tracker</h1>


    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
        <div class="bg-white shadow-xl rounded-xl inline-block max-w-96 py-5">
            <p class="text-sm text-[#323B49] mx-2">Total</p>
            <p id="totalcount" class="font-bold text-2xl mx-2">8</p>
        </div>

          <div class="bg-white shadow-xl rounded-xl inline-block max-w-96 py-5">
            <p class="text-sm text-[#323B49] mx-2">Interview</p>
            <p id="interviewcount" class="font-bold text-2xl mx-2 text-green-600">0</p>
        </div>


          <div class="bg-white shadow-xl rounded-xl inline-block w-96 py-5">
            <p class="text-sm text-[#323B49] mx-2">Rejected</p>
            <p id="rejectedcount" class="font-bold text-2xl mx-2 text-red-600">0</p>
        </div>
    </div>

</header>



 
</body>
</html>
